name: CI/CD - API

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 🔨 Build & Push API to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/arturo-enriquez-v/autohost-cloud-api:latest

  deploy:
    name: 🚀 Deploy API (Runner)
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Login a GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull imagen API
        run: docker pull ghcr.io/arturo-enriquez-v/autohost-cloud-api:latest

      - name: Reiniciar servicio API
        run: docker compose -f ~/prod/autohost-cloud-api/compose.yml up -d
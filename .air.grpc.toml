# .air.grpc.toml - Hot reload para el servicio gRPC (Compute Engine / VPS replica)
root = "."
tmp_dir = "tmp/grpc"

[build]
pre_cmd = ["mkdir -p ./tmp/grpc"]
cmd = "go build -o ./tmp/grpc/api ./cmd/api"
bin = "tmp/grpc/api"
include_ext = ["go", "tpl", "tmpl", "html"]
include_dir = ["cmd", "internal", "migrations"]
exclude_dir = ["tmp", "vendor", ".git"]
delay = 200
kill_delay = 500
stop_on_error = true
send_interrupt = true

[log]
time = true
main_only = false

[color]
main    = "blue"
watcher = "cyan"
build   = "yellow"
runner  = "green"

[misc]
clean_on_exit = true

services:
  $service-name:
    image: ghcr.io/homarr-labs/homarr:v2
    container_name: $service-name
    restart: unless-stopped
    ports:
      - "$port:7575"
    environment:
      SECRET_ENCRYPTION_KEY: "$encryption-key"
    volumes:
      - $service-name-appdata:/appdata
    networks:
      - autohost_net

volumes:
  $service-name-appdata:

networks:
  autohost_net:
    external: true

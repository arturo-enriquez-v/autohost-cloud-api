syntax = "proto3";

package node_agent.v1;

option go_package = "github.com/arturo/autohost-cloud-api/internal/grpc/nodepb";

// ─── Shared enums ────────────────────────────────────────────────────────────

enum CommandType {
  COMMAND_TYPE_DEFAULT     = 0;
  COMMAND_TYPE_CUSTOM      = 1;
  COMMAND_TYPE_INSTALL_APP = 2;
  COMMAND_TYPE_SWARM       = 3;
}

// ProfileType selects what the agent should sample.
enum ProfileType {
  PROFILE_TYPE_HEAP = 0;  // Heap / memory allocation snapshot (instantaneous)
  PROFILE_TYPE_CPU  = 1;  // CPU sampling for duration_seconds
}

enum JobStatus {
  JOB_STATUS_RUNNING   = 0;
  JOB_STATUS_COMPLETED = 1;
  JOB_STATUS_FAILED    = 2;
}

// ─── RegisterCommands ────────────────────────────────────────────────────────
// The agent calls this on startup to announce the commands it supports.
// Each message in the client stream is one command; the server responds once.

message RegisterCommandRequest {
  string node_id     = 1;  // validated against the auth token server-side
  string name        = 2;
  string description = 3;
  CommandType type   = 4;
  string script_path = 5;  // only set for COMMAND_TYPE_CUSTOM
}

message RegisterCommandsResponse {
  int32  registered = 1;   // total commands upserted in this batch
}


// ─── Connect (bidirectional streaming) ───────────────────────────────────────
// The agent opens a single long-lived stream.
//   agent  → server : NodeMessage  (job results, heartbeats, log entries)
//   server → agent  : ServerMessage (execute_job, stream_logs, stop_logs)

message NodeMessage {
  oneof payload {
    JobResultPayload         job_result       = 1;
    HeartbeatPayload         heartbeat        = 2;
    LogEntryPayload          log_entry        = 3;
    MetricPayload            metric           = 4;
    HealthCheckResultPayload health_result    = 5;
    ProfileDataPayload       profile_data     = 6;
    ContainerListPayload     container_list   = 7;
    LogDiagnosticPayload     log_diagnostic   = 8;
    NetworkStatsPayload      network_stats    = 9;
    HypervisorInfoPayload    hypervisor_info  = 10;
  }
}

// ─── Hypervisor (agent → server) ─────────────────────────────────────────────

// Reports whether the node can host virtual machines (KVM + libvirt) and how
// many resources it has available for them. Sent once per Connect session.
message HypervisorInfoPayload {
  bool   capable                 = 1;  // true when KVM and libvirt are both usable
  bool   kvm_available           = 2;  // /dev/kvm is present
  bool   libvirt_available       = 3;  // virsh can reach qemu:///system
  string libvirt_version         = 4;
  string reason                  = 5;  // human-readable cause when capable == false
  string network_name            = 6;  // libvirt network used for guests (e.g. "default")
  uint32 cpu_cores               = 7;  // host logical cores
  uint64 ram_total_bytes         = 8;  // host RAM
  uint64 storage_total_bytes     = 9;  // size of the VM storage pool filesystem
  uint64 storage_available_bytes = 10;
}

// ─── Metric (agent → server, via Connect stream) ─────────────────────────────
// Mirrors MetricRequest but lives in NodeMessage for the Connect stream.

message MetricPayload {
  float  cpu_usage_percent    = 1;
  uint64 ram_total_bytes      = 2;
  uint64 ram_used_bytes       = 3;
  uint64 ram_available_bytes  = 4;
  float  ram_usage_percent    = 5;
  uint64 disk_total_bytes     = 6;
  uint64 disk_used_bytes      = 7;
  uint64 disk_available_bytes = 8;
  float  disk_usage_percent   = 9;
  int64  uptime_seconds       = 10;
  float  cpu_temp_celsius     = 11;
}

message ServerMessage {
  oneof payload {
    ExecuteJobPayload           execute_job            = 1;
    StreamLogsPayload           stream_logs            = 2;
    StopLogsPayload             stop_logs              = 3;
    ConfigureHealthCheckPayload configure_health_check = 4;
    StopHealthCheckPayload      stop_health_check      = 5;
    RequestProfilePayload       request_profile        = 6;
    StreamContainersPayload     stream_containers      = 7;
    StopContainersPayload       stop_containers        = 8;
    CollectLogsPayload          collect_logs           = 9;
    RequestNetworkStatsPayload  request_network_stats  = 10;
  }
}

message JobResultPayload {
  string    job_id  = 1;
  JobStatus status  = 2;
  string    output  = 3;
  string    error   = 4;
}

message HeartbeatPayload {
  string node_id = 1;
}

message ExecuteJobPayload {
  string      job_id       = 1;
  string      command_name = 2;
  CommandType command_type = 3;
  string      params       = 4;  // JSON-encoded parameters (e.g. for INSTALL_APP)
}

// ─── Log streaming ───────────────────────────────────────────────────────────

// Sent by server to ask the agent to start streaming logs.
message StreamLogsPayload {
  string unit  = 1;  // systemd unit name, e.g. "autohost-agent" or "" for all
  int32  lines = 2;  // how many historical lines to tail first (0 = no history)
}

// Sent by server to ask the agent to stop streaming logs.
message StopLogsPayload {}

// Sent by agent to the server, one per log line.
message LogEntryPayload {
  int64  timestamp_us = 1;  // Unix microseconds
  string unit         = 2;  // source systemd unit
  string message      = 3;
}

// ─── Health Check (server → agent) ───────────────────────────────────────────

// Sent by the server to configure or update a health check on the agent.
message ConfigureHealthCheckPayload {
  string monitor_id           = 1;
  string service_name         = 2;
  string check_type           = 3;  // "process" | "tcp" | "http"
  string http_url             = 4;
  int32  http_expected_status = 5;
  string tcp_host             = 6;
  int32  tcp_port             = 7;
  int32  interval_seconds     = 8;
  int32  failure_threshold    = 9;
  bool   enabled              = 10;
  string auto_heal_config     = 11; // JSON string of AutoHealConfig
  string auto_heal_state      = 12; // JSON string of ServiceHealthState
}

// Sent by the server to remove a health check from the agent.
message StopHealthCheckPayload {
  string monitor_id = 1;
}

// ─── Health Check Result (agent → server) ────────────────────────────────────

// Sent by the agent after each health check execution.
message HealthCheckResultPayload {
  string monitor_id            = 1;
  string status                = 2;  // "up" | "down"
  int32  latency_ms            = 3;
  string message               = 4;
  int32  consecutive_failures  = 5;
  string auto_heal_state       = 6; // JSON string of updated ServiceHealthState
}

// ─── Profiling (server → agent, then agent → server) ─────────────────────────

// Sent by server to ask the agent to collect a pprof profile.
message RequestProfilePayload {
  string      request_id       = 1;  // correlation ID (UUID)
  ProfileType profile_type     = 2;
  int32       duration_seconds = 3;  // only relevant for PROFILE_TYPE_CPU (0 → 30 s default)
}

// Sent by agent to deliver the raw pprof bytes back to the server.
message ProfileDataPayload {
  string      request_id   = 1;  // matches RequestProfilePayload.request_id
  ProfileType profile_type = 2;
  bytes       data         = 3;  // raw pprof binary (pprof.WriteHeapProfile / StopCPUProfile output)
  string      error        = 4;  // non-empty when collection failed
}

// ─── Container streaming (server → agent, then agent → server) ───────────────

// Sent by server to ask the agent to start streaming container state snapshots.
message StreamContainersPayload {}

// Sent by server to ask the agent to stop streaming container state.
message StopContainersPayload {}

// One Docker container entry within a ContainerListPayload snapshot.
message ContainerInfo {
  string id       = 1;
  string name     = 2;
  string image    = 3;
  string state    = 4;  // "running" | "exited" | "paused" | "restarting" | …
  string status   = 5;  // human-readable, e.g. "Up 2 hours"
  string cpu      = 6;  // CPU usage percentage string (only for running containers)
  string mem      = 7;  // memory usage/limit string (only for running containers)
  string mem_perc = 8;  // memory percentage string (only for running containers)
}

// Full container list snapshot sent by the agent whenever the list changes.
message ContainerListPayload {
  repeated ContainerInfo containers = 1;
  string error = 2;  // non-empty when Docker is unavailable
}

// ─── Metrics ─────────────────────────────────────────────────────────────────

message MetricRequest {
  float  cpu_usage_percent    = 1;
  uint64 ram_total_bytes      = 2;
  uint64 ram_used_bytes       = 3;
  uint64 ram_available_bytes  = 4;
  float  ram_usage_percent    = 5;
  uint64 disk_total_bytes     = 6;
  uint64 disk_used_bytes      = 7;
  uint64 disk_available_bytes = 8;
  float  disk_usage_percent   = 9;
  int64  uptime_seconds       = 10;
  float  cpu_temp_celsius     = 11;
}

message MetricResponse {
  bool success = 1;
}

// ─── Log Diagnostics (server → agent, then agent → server) ──────────────────

// Server asks agent to collect, sanitize and prepare a diagnostic log bundle.
message CollectLogsPayload {
  string   request_id          = 1;  // correlation UUID
  repeated string sources      = 2;  // e.g. ["autohost-agent", "docker:nginx"]
  int32    lines_per_source    = 3;  // max lines per source (default 200, max 500)
  bool     include_containers  = 4;  // also collect all running container logs
}

// Agent returns sanitized logs + local pattern analysis to the server.
message LogDiagnosticPayload {
  string                   request_id       = 1;  // correlation UUID
  string                   diagnostic_json  = 2;  // full JSON diagnostic report
  repeated LogSourceBundle sources          = 3;  // raw sanitized log bundles
  string                   error            = 4;  // non-empty if collection failed
}

// One log source within a diagnostic bundle.
message LogSourceBundle {
  string source     = 1;  // e.g. "journalctl:autohost-agent" or "docker:nginx"
  string raw_logs   = 2;  // sanitized log text
  int32  line_count = 3;
}

// ─── Network Stats (server → agent, then agent → server, on-demand) ─────────

message RequestNetworkStatsPayload {
  string request_id = 1;
}

message NetworkStatsPayload {
  string request_id = 1;
  string stats_json = 2;  // JSON-encoded IngestPayload
  string error      = 3;
}

// ─── Service ─────────────────────────────────────────────────────────────────

service NodeAgentService {
  // Agent streams its commands; server upserts them all, then acks.
  rpc RegisterCommands(stream RegisterCommandRequest) returns (RegisterCommandsResponse);

  // Long-lived bidirectional stream used to dispatch jobs and receive results.
  rpc Connect(stream NodeMessage) returns (stream ServerMessage);

  // Send node system metrics to the server.
  rpc ReportMetrics(MetricRequest) returns (MetricResponse);
}

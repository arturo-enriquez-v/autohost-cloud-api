# .air.toml (en la raíz del repo)
root = "."
tmp_dir = "tmp"

[build]
pre_cmd = ["mkdir -p ./tmp"]
cmd = "go build -o ./tmp/api ./cmd/api"
bin = "tmp/api"
include_ext = ["go", "tpl", "tmpl", "html"]
include_dir = ["cmd", "internal", "migrations"]
exclude_dir = ["tmp", "vendor", ".git"]
delay = 200
kill_delay = 500
# Si el build falla, muestra el error claramente y NO arranca el binario anterior
stop_on_error = true
# Muestra la salida de stderr del binario (logs del servidor)
send_interrupt = true

[log]
# Timestamps en cada línea del log de air
time = true
# Muestra logs del proceso principal (el servidor Go)
main_only = false

[color]
main    = "magenta"
watcher = "cyan"
build   = "yellow"
runner  = "green"

[misc]
# Borra el binario tmp/api al salir (evita correr binario desactualizado)
clean_on_exit = true

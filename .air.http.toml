# .air.http.toml - Hot reload para el servicio HTTP / REST (Cloud Run replica)
root = "."
tmp_dir = "tmp/http"

[build]
pre_cmd = ["mkdir -p ./tmp/http"]
cmd = "go build -o ./tmp/http/api ./cmd/api"
bin = "tmp/http/api"
include_ext = ["go", "tpl", "tmpl", "html"]
include_dir = ["cmd", "internal", "migrations"]
exclude_dir = ["tmp", "vendor", ".git"]
delay = 200
kill_delay = 500
stop_on_error = true
send_interrupt = true

[log]
time = true
main_only = false

[color]
main    = "magenta"
watcher = "cyan"
build   = "yellow"
runner  = "green"

[misc]
clean_on_exit = true
